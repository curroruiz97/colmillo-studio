    <title>Colmillo Studio — próximamente</title>
    <meta
      name="description"
      content="Colmillo Studio. Estamos construyendo la web."
    />
    <!--
      The site is not released and is not to be indexed: the repository's
      release and indexing gates are both still closed, and this page holds
      the domain until they are opened deliberately. See docs/DEPLOYMENT.md.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Google Search Console: la misma verificacion que servia el WordPress,
         para que la propiedad no se pierda al retirarlo del dominio. -->
    <meta
      name="google-site-verification"
      content="H3tofIm_Cy0YOjfy-1qpABWREgqRJ8cBh2dK7gDwmy0"
    />

    <!--
      COLMILLO STUDIO — holding page for colmillostudio.com
      2026-09-24. Deliberately self-contained: this file, one image and a
      robots.txt, with no build step and no route but this one, so nothing
      from the provisional site or the fictional demo can reach the domain by
      accident. The ball is the contact section's own object, at rest, drawn
      from the same geometry and pasted here as a still.

      The wording is provisional and pending the client's approval — see
      docs/CONTENT_NEEDED.md.
    -->
    <style>
      :root {
        --cream: #fceeda;
        --ink: #12100f;
        --soft-ink: #2a211d;
        --orange: #cd5730;
        /* The accessible orange, for anything at text size. */
        --orange-text: #b54d2a;
        --gutter: clamp(1.5rem, 5vw, 5.5rem);
        --body:
          system-ui, -apple-system, 'Segoe UI', roboto, helvetica, arial,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--cream);
      }

      body {
        min-height: 100svh;
        margin: 0;
        padding: clamp(2rem, 6vh, 4rem) var(--gutter);
        display: flex;
        flex-direction: column;
        gap: clamp(2rem, 6vh, 3.5rem);
        background: var(--cream);
        color: var(--ink);
        font-family: var(--body);
        -webkit-font-smoothing: antialiased;
      }

      .mark {
        display: block;
        width: clamp(9rem, 16vw, 15rem);
        height: auto;
      }

      .stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: clamp(2.5rem, 7vh, 4rem);
      }

      h1 {
        max-width: 18ch;
        margin: 0;
        font-size: clamp(2.1rem, 6.4vw, 4.6rem);
        font-weight: 800;
        letter-spacing: -0.045em;
        line-height: 1.02;
        text-wrap: balance;
      }

      h1 em {
        color: var(--orange);
        font-style: normal;
      }

      .lede {
        max-width: 34ch;
        margin: clamp(1.1rem, 3vh, 1.6rem) 0 0;
        color: var(--soft-ink);
        font-size: clamp(1.05rem, 1.5vw, 1.3rem);
        line-height: 1.5;
      }

      .ways {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem clamp(1.5rem, 4vw, 2.75rem);
        margin: clamp(1.6rem, 4vh, 2.25rem) 0 0;
        padding: 0;
        list-style: none;
        font-size: clamp(1rem, 1.35vw, 1.15rem);
      }

      a {
        color: var(--orange-text);
        text-decoration-thickness: 1px;
        text-underline-offset: 0.28em;
      }

      a:hover {
        color: var(--ink);
      }

      a:focus-visible {
        border-radius: 0.2rem;
        outline: 3px solid var(--orange-text);
        outline-offset: 4px;
      }

      /* The contact section's object, at rest. Decorative: it says nothing
         the type does not, so it is hidden from assistive technology. */
      .ball {
        display: block;
        width: 100%;
        max-width: 26rem;
        height: auto;
        margin-inline: auto;
      }

      @media (min-width: 56rem) {
        .stage {
          flex-direction: row;
          align-items: center;
          gap: clamp(2rem, 6vw, 5rem);
        }

        .say {
          flex: 1 1 32rem;
        }

        .piece {
          flex: 0 1 34rem;
          min-width: 0;
        }

        .ball {
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <a href="/" aria-label="Colmillo Studio">
      <img

        src="colmillo.png"
        width="906"
        height="257"

        <h1>Estamos construyendo la <em>web</em>.</h1>
        <p class="lede">
          Vuelve pronto. Mientras tanto, si quieres que tu marca muerda,
          hablemos.
        </p>
        <ul class="ways">
          <li>
            <a href="mailto:hola@colmillostudio.com">hola@colmillostudio.com</a>
          </li>
          <li>
            <a
              href="https://www.instagram.com/colmillo.studio/"
              rel="me noopener"
              >Instagram</a
            >
          </li>
        </ul>
